name: release

# Publie l'installateur Windows sur GitHub Releases à chaque tag « v* ».
# L'application installée détecte automatiquement la nouvelle release
# (electron-updater) et se met à jour toute seule.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # electron-builder uploade ses fichiers en parallèle et chaque upload
      # peut créer la release s'il ne la trouve pas → course = DEUX releases
      # sur le même tag, et l'URL /releases/download/<tag>/ tombe sur la
      # mauvaise (404). On crée donc la release AVANT, une seule fois.
      - name: Créer la release (anti-doublon)
        shell: bash
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Mise à jour automatique de Lorcana Picking Tool." --repo "${{ github.repository }}" || echo "release déjà existante"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installateur + publication GitHub Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
